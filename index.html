<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				var s = localStorage.getItem("color-scheme");
				document.querySelector('meta[name="color-scheme"]').content = s === "light" || s === "dark" ? s : "light dark";
			} catch (e) {}
		</script>
		<link rel="icon" href="/src-tauri/icons/32x32.png" />
		<title>Modium</title>
	</head>
	<body style="margin:0;">
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
